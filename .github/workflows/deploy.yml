name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teammy-production-deployment
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Build immutable image and release
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      MIGRATION_JOB_NAME: ${{ vars.MIGRATION_JOB_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate with GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2 (verified tag target)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to the dedicated registry
        shell: bash
        run: |
          [[ "$ACR_LOGIN_SERVER" =~ ^[a-z0-9]+\.azurecr\.io$ ]] || { echo 'Set ACR_LOGIN_SERVER to the Terraform registry output.'; exit 1; }
          az acr login --name "${ACR_LOGIN_SERVER%%.*}" --only-show-errors
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish candidate with provenance and SBOM
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/teammy-api:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Gate the exact candidate image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/teammy-api@${{ steps.image.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Migrate, verify candidate, switch traffic, monitor
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/deploy-azure.sh "$ACR_LOGIN_SERVER/teammy-api@$IMAGE_DIGEST" "r${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence
          path: artifacts/deployment.json
          if-no-files-found: warn
          retention-days: 90
